<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Noriel Otalvaro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #02030a;
            color: white;
        }

        body {
            position: relative;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: min(900px, 100%);
        }

        .moon {
            width: 78px;
            height: 78px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 30%,
                    #ffffff 0%,
                    #e9e9f2 35%,
                    #b8b8c8 70%,
                    #777788 100%);
            box-shadow:
                0 0 25px rgba(255,255,255,.35),
                0 0 70px rgba(130,140,255,.18);
            position: relative;
        }

        .moon::after {
            content: "";
            position: absolute;
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: #02030a;
            left: 25px;
            top: -8px;
        }

        h1 {
            font-size: clamp(42px, 7vw, 78px);
            font-weight: 500;
            letter-spacing: -3px;
            margin-bottom: 12px;
            text-shadow: 0 0 30px rgba(255,255,255,.15);
        }

        .subtitle {
            font-size: 18px;
            color: rgba(255,255,255,.58);
            letter-spacing: 2px;
            margin-bottom: 45px;
        }

        .services {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .service {
            width: 210px;
            padding: 22px 20px;
            border-radius: 18px;
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition:
                transform .3s ease,
                background .3s ease,
                border-color .3s ease,
                box-shadow .3s ease;
        }

        .service:hover {
            transform: translateY(-7px);
            background: rgba(255,255,255,.10);
            border-color: rgba(255,255,255,.28);
            box-shadow: 0 15px 45px rgba(0,0,0,.35);
        }

        .icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .service-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .service-description {
            font-size: 13px;
            color: rgba(255,255,255,.5);
        }

        .footer {
            position: fixed;
            bottom: 22px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 2;
            font-size: 12px;
            color: rgba(255,255,255,.3);
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {

            html, body {
                overflow-y: auto;
            }

            .content {
                min-height: 100%;
                height: auto;
                padding: 70px 20px;
            }

            h1 {
                letter-spacing: -2px;
            }

            .subtitle {
                margin-bottom: 35px;
            }

            .services {
                flex-direction: column;
                align-items: center;
            }

            .service {
                width: min(330px, 100%);
            }

            .footer {
                position: relative;
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

<canvas id="space"></canvas>

<div class="content">

    <div class="container">

        <div class="moon"></div>

        <h1>Noriel Otalvaro</h1>

        <p class="subtitle">
            MI PORTAL PERSONAL
        </p>

        <div class="services">

            <a
                class="service"
                href="https://accounts.zoho.com/signin?service_language=es&servicename=VirtualOffice&signupurl=https://www.zoho.com/mail/signup.html&serviceurl=https://mail.zoho.com"
            >
                <div class="icon">📧</div>

                <div class="service-title">
                    Correo
                </div>

                <div class="service-description">
                    Zoho Mail
                </div>
            </a>


            <a
                class="service"
                href="https://fotos.norielotalvaro.com"
            >
                <div class="icon">📸</div>

                <div class="service-title">
                    Fotos
                </div>

                <div class="service-description">
                    Mi biblioteca personal
                </div>
            </a>


            <a
                class="service"
                href="#"
                onclick="return false;"
            >
                <div class="icon">🖥️</div>

                <div class="service-title">
                    Servidor
                </div>

                <div class="service-description">
                    Próximamente
                </div>
            </a>

        </div>

    </div>

</div>

<div class="footer">
    NORIEL OTALVARO · PERSONAL PORTAL
</div>


<script>

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

let width;
let height;

let mouse = {
    x: window.innerWidth / 2,
    y: window.innerHeight / 2
};

let particles = [];

const PARTICLE_COUNT = 110;
const CONNECTION_DISTANCE = 135;

function resize() {

    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    particles = [];

    for (let i = 0; i < PARTICLE_COUNT; i++) {

        particles.push({
            x: Math.random() * width,
            y: Math.random() * height,

            vx: (Math.random() - 0.5) * 0.25,
            vy: (Math.random() - 0.5) * 0.25,

            radius: Math.random() * 1.7 + 0.4
        });
    }
}

window.addEventListener("resize", resize);

window.addEventListener("mousemove", (event) => {

    mouse.x = event.clientX;
    mouse.y = event.clientY;

});

window.addEventListener("touchmove", (event) => {

    if (event.touches.length > 0) {

        mouse.x = event.touches[0].clientX;
        mouse.y = event.touches[0].clientY;

    }

}, { passive: true });


function draw() {

    ctx.clearRect(0, 0, width, height);

    /*
        Fondo espacial
    */

    const gradient = ctx.createRadialGradient(
        mouse.x,
        mouse.y,
        0,
        mouse.x,
        mouse.y,
        Math.max(width, height) * 0.7
    );

    gradient.addColorStop(0, "rgba(65,75,140,.13)");
    gradient.addColorStop(0.4, "rgba(10,15,45,.08)");
    gradient.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);


    /*
        Movimiento de partículas
    */

    particles.forEach(p => {

        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > width)
            p.vx *= -1;

        if (p.y < 0 || p.y > height)
            p.vy *= -1;


        /*
            Atracción hacia el mouse
        */

        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 190) {

            const force = (190 - distance) / 190;

            p.x -= dx * force * 0.0025;
            p.y -= dy * force * 0.0025;
        }

    });


    /*
        Líneas de constelación
    */

    for (let i = 0; i < particles.length; i++) {

        for (let j = i + 1; j < particles.length; j++) {

            const a = particles[i];
            const b = particles[j];

            const dx = a.x - b.x;
            const dy = a.y - b.y;

            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < CONNECTION_DISTANCE) {

                const opacity =
                    (1 - distance / CONNECTION_DISTANCE) * 0.32;

                ctx.beginPath();

                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);

                ctx.strokeStyle =
                    `rgba(180,190,255,${opacity})`;

                ctx.lineWidth = 0.6;

                ctx.stroke();
            }
        }
    }


    /*
        Conexiones con el puntero
    */

    particles.forEach(p => {

        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 220) {

            const opacity =
                (1 - distance / 220) * 0.55;

            ctx.beginPath();

            ctx.moveTo(p.x, p.y);
            ctx.lineTo(mouse.x, mouse.y);

            ctx.strokeStyle =
                `rgba(210,220,255,${opacity})`;

            ctx.lineWidth = 0.8;

            ctx.stroke();
        }
    });


    /*
        Estrellas
    */

    particles.forEach(p => {

        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;

        const distance = Math.sqrt(dx * dx + dy * dy);

        let glow = 0.55;

        if (distance < 180) {
            glow += (1 - distance / 180) * 0.45;
        }

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(225,230,255,${glow})`;

        ctx.fill();
    });


    /*
        Punto luminoso del cursor
    */

    const cursorGlow = ctx.createRadialGradient(
        mouse.x,
        mouse.y,
        0,
        mouse.x,
        mouse.y,
        80
    );

    cursorGlow.addColorStop(
        0,
        "rgba(180,195,255,.18)"
    );

    cursorGlow.addColorStop(
        1,
        "rgba(180,195,255,0)"
    );

    ctx.fillStyle = cursorGlow;

    ctx.fillRect(
        mouse.x - 80,
        mouse.y - 80,
        160,
        160
    );


    requestAnimationFrame(draw);
}

resize();
draw();

</script>

</body>
</html>
