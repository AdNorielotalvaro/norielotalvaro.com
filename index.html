<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Noriel Otalvaro</title>


    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #02030a;

            color: white;
        }

        body {

            position: relative;

            cursor: default;
        }


        /* =====================================================
           CANVAS DE CONSTELACIONES
        ===================================================== */

        canvas {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 0;

            pointer-events: none;
        }


        /* =====================================================
           CONTENIDO PRINCIPAL
        ===================================================== */

        .content {

            position: relative;

            z-index: 2;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 25px;
        }


        .container {

            width:
                min(900px, 100%);

        }


        /* =====================================================
           LUNA
        ===================================================== */

        .moon {

            width: 105px;
            height: 105px;

            margin:
                0 auto 28px;

            border-radius: 50%;

            position: relative;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 32% 28%,
                    #ffffff 0%,
                    #eeeeee 18%,
                    #d6d6d6 38%,
                    #b1b1b1 62%,
                    #777777 85%,
                    #555555 100%
                );

            box-shadow:

                0 0 25px
                rgba(255,255,255,.38),

                0 0 60px
                rgba(180,190,255,.22),

                0 0 110px
                rgba(130,140,255,.12);

            transition:
                transform .5s ease,
                box-shadow .5s ease;
        }


        /* Brillo lunar */

        .moon::before {

            content: "";

            position: absolute;

            inset: 0;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle at 30% 25%,
                    rgba(255,255,255,.5),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 70% 70%,
                    rgba(0,0,0,.25),
                    transparent 55%
                );

            z-index: 1;

            pointer-events: none;
        }


        /* Textura */

        .moon::after {

            content: "";

            position: absolute;

            inset: 0;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle at 20% 18%,
                    rgba(70,70,70,.35) 0%,
                    transparent 7%
                ),

                radial-gradient(
                    circle at 75% 22%,
                    rgba(60,60,60,.25) 0%,
                    transparent 10%
                ),

                radial-gradient(
                    circle at 42% 72%,
                    rgba(50,50,50,.25) 0%,
                    transparent 10%
                ),

                radial-gradient(
                    circle at 85% 72%,
                    rgba(60,60,60,.25) 0%,
                    transparent 8%
                );

            opacity: .9;

            z-index: 2;

            pointer-events: none;
        }


        /* =====================================================
           CRÁTERES
        ===================================================== */

        .moon-crater {

            position: absolute;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle at 35% 30%,
                    #707070 0%,
                    #929292 32%,
                    #bcbcbc 62%,
                    #808080 100%
                );

            box-shadow:

                inset 3px 3px 7px
                rgba(0,0,0,.35),

                inset -2px -2px 5px
                rgba(255,255,255,.25);

            z-index: 3;

            opacity: .82;
        }


        .crater-1 {

            width: 24px;
            height: 24px;

            left: 17px;
            top: 23px;
        }


        .crater-2 {

            width: 14px;
            height: 14px;

            left: 53px;
            top: 14px;
        }


        .crater-3 {

            width: 29px;
            height: 29px;

            left: 55px;
            top: 53px;
        }


        .crater-4 {

            width: 17px;
            height: 17px;

            left: 20px;
            top: 67px;
        }


        .crater-5 {

            width: 11px;
            height: 11px;

            left: 73px;
            top: 35px;
        }


        .crater-6 {

            width: 13px;
            height: 13px;

            left: 41px;
            top: 43px;
        }


        .crater-7 {

            width: 9px;
            height: 9px;

            left: 79px;
            top: 76px;
        }


        .crater-8 {

            width: 18px;
            height: 18px;

            left: 7px;
            top: 51px;
        }


        .crater-9 {

            width: 8px;
            height: 8px;

            left: 35px;
            top: 12px;
        }


        .crater-10 {

            width: 12px;
            height: 12px;

            left: 87px;
            top: 51px;
        }


        /* =====================================================
           SOMBRA DE FASE LUNAR
        ===================================================== */

        .moon-shadow {

            position: absolute;

            width: 115px;
            height: 115px;

            border-radius: 50%;

            background: #02030a;

            left: 39px;
            top: -12px;

            opacity: .94;

            z-index: 5;

            pointer-events: none;
        }


        /* =====================================================
           TITULO
        ===================================================== */

        h1 {

            font-size:
                clamp(42px, 7vw, 78px);

            font-weight: 500;

            letter-spacing: -3px;

            margin-bottom: 12px;

            text-shadow:
                0 0 30px
                rgba(255,255,255,.15);

            transition:
                text-shadow .4s ease;
        }


        /* =====================================================
           SUBTITULO
        ===================================================== */

        .subtitle {

            font-size: 18px;

            color:
                rgba(255,255,255,.58);

            letter-spacing: 2px;

            margin-bottom: 45px;
        }


        /* =====================================================
           TARJETAS
        ===================================================== */

        .services {

            display: flex;

            justify-content: center;

            gap: 18px;

            flex-wrap: wrap;
        }


        .service {

            width: 210px;

            padding: 22px 20px;

            border-radius: 18px;

            text-decoration: none;

            color: white;

            background:
                rgba(255,255,255,.055);

            border:
                1px solid
                rgba(255,255,255,.12);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            transition:

                transform .3s ease,

                background .3s ease,

                border-color .3s ease,

                box-shadow .3s ease;
        }


        .service:hover {

            transform:
                translateY(-7px);

            background:
                rgba(255,255,255,.11);

            border-color:
                rgba(255,255,255,.32);

            box-shadow:

                0 15px 45px
                rgba(0,0,0,.35),

                0 0 35px
                rgba(160,170,255,.08);
        }


        .service:hover
        .icon {

            transform:
                scale(1.12);
        }


        .icon {

            font-size: 30px;

            margin-bottom: 10px;

            transition:
                transform .3s ease;
        }


        .service-title {

            font-size: 17px;

            font-weight: 600;

            margin-bottom: 6px;
        }


        .service-description {

            font-size: 13px;

            color:
                rgba(255,255,255,.5);
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            position: fixed;

            bottom: 22px;

            left: 0;

            width: 100%;

            text-align: center;

            z-index: 2;

            font-size: 12px;

            color:
                rgba(255,255,255,.3);

            letter-spacing: 1px;
        }


        /* =====================================================
           MÓVIL
        ===================================================== */

        @media (max-width: 600px) {

            html,
            body {

                overflow-y: auto;
            }


            .content {

                min-height: 100%;

                height: auto;

                padding:
                    70px 20px;
            }


            h1 {

                letter-spacing:
                    -2px;
            }


            .subtitle {

                margin-bottom:
                    35px;
            }


            .services {

                flex-direction:
                    column;

                align-items:
                    center;
            }


            .service {

                width:
                    min(330px, 100%);
            }


            .footer {

                position:
                    relative;

                margin-top:
                    20px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CANVAS
    ====================================================== -->

    <canvas id="constellation"></canvas>


    <!-- =====================================================
         CONTENIDO
    ====================================================== -->

    <div class="content">

        <div class="container">


            <!-- =================================================
                 LUNA
            ================================================== -->

            <div class="moon">

                <div class="moon-crater crater-1"></div>

                <div class="moon-crater crater-2"></div>

                <div class="moon-crater crater-3"></div>

                <div class="moon-crater crater-4"></div>

                <div class="moon-crater crater-5"></div>

                <div class="moon-crater crater-6"></div>

                <div class="moon-crater crater-7"></div>

                <div class="moon-crater crater-8"></div>

                <div class="moon-crater crater-9"></div>

                <div class="moon-crater crater-10"></div>

                <div class="moon-shadow"></div>

            </div>


            <!-- =================================================
                 TITULO
            ================================================== -->

            <h1>
                Noriel Otalvaro
            </h1>


            <p class="subtitle">
                MI PORTAL PERSONAL
            </p>


            <!-- =================================================
                 SERVICIOS
            ================================================== -->

            <div class="services">


                <!-- CORREO -->

                <a
                    class="service"

                <!-- FOTOS -->

                <a
                    class="service"

                >

                    <div class="icon">
                        📸
                    </div>

                    <div class="service-title">

                    </div>

                    <div class="service-description">
                        Mi biblioteca personal
                    </div>

                </a>


                <!-- SERVIDOR -->

                <a
                    class="service"
                    href="#"
                    onclick="return false;"
                >

                    <div class="icon">
                        🖥️
                    </div>

                    <div class="service-title">

                    </div>

                    <div class="service-description">
                        Próximamente
                    </div>

                </a>


            </div>


        </div>

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="footer">

        © 2026 Noriel Otalvaro

    </div>


    <!-- =====================================================
         JAVASCRIPT — CONSTELACIONES
    ====================================================== -->

    <script>

        const canvas =
            document.getElementById(
                "constellation"
            );

        const ctx =
            canvas.getContext("2d");


        let width;
        let height;


        let mouse = {

            x: null,
            y: null,

            active: false

        };


        let stars = [];


        /*
         * Cantidad de estrellas
         */

        const STAR_DENSITY =
            8500;


        /*
         * Distancia máxima entre
         * estrellas para crear líneas
         */

        const CONNECTION_DISTANCE =
            125;


        /*
         * Distancia del mouse
         */

        const MOUSE_DISTANCE =
            180;


        /*
         * Inicializar canvas
         */

        function resize() {

            width =
                canvas.width =
                    window.innerWidth;

            height =
                canvas.height =
                    window.innerHeight;


            createStars();

        }


        /*
         * Crear estrellas
         */

        function createStars() {

            stars = [];


            const count =
                Math.min(
                    180,
                    Math.floor(
                        width *
                        height /
                        STAR_DENSITY
                    )
                );


            for (
                let i = 0;
                i < count;
                i++
            ) {

                stars.push({

                    x:
                        Math.random() *
                        width,

                    y:
                        Math.random() *
                        height,

                    radius:
                        Math.random() *
                        1.5 + .3,

                    vx:
                        (Math.random() - .5)
                        * .18,

                    vy:
                        (Math.random() - .5)
                        * .18,

                    opacity:
                        Math.random() *
                        .65 + .2,

                    pulse:
                        Math.random() *
                        Math.PI * 2,

                    pulseSpeed:
                        Math.random() *
                        .015 + .005

                });

            }

        }


        /*
         * Mouse
         */

        window.addEventListener(
            "mousemove",
            function(event) {

                mouse.x =
                    event.clientX;

                mouse.y =
                    event.clientY;

                mouse.active =
                    true;

            }
        );


        window.addEventListener(
            "mouseleave",
            function() {

                mouse.active =
                    false;

            }
        );


        /*
         * Touch
         */

        window.addEventListener(
            "touchmove",
            function(event) {

                if (
                    event.touches.length
                ) {

                    mouse.x =
                        event.touches[0]
                        .clientX;

                    mouse.y =
                        event.touches[0]
                        .clientY;

                    mouse.active =
                        true;

                }

            },
            {
                passive: true
            }
        );


        /*
         * Dibujar estrellas
         */

        function drawStars() {

            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            /*
             * Actualizar estrellas
             */

            stars.forEach(
                star => {

                    star.x += star.vx;

                    star.y += star.vy;

                    star.pulse +=
                        star.pulseSpeed;


                    /*
                     * Rebote suave
                     */

                    if (
                        star.x < -20 ||
                        star.x > width + 20
                    ) {

                        star.vx *= -1;

                    }


                    if (
                        star.y < -20 ||
                        star.y > height + 20
                    ) {

                        star.vy *= -1;

                    }


                    /*
                     * Interacción con mouse
                     */

                    if (
                        mouse.active
                    ) {

                        const dx =
                            mouse.x -
                            star.x;

                        const dy =
                            mouse.y -
                            star.y;

                        const distance =
                            Math.sqrt(
                                dx * dx +
                                dy * dy
                            );


                        if (
                            distance <
                            MOUSE_DISTANCE
                        ) {

                            const force =
                                (
                                    MOUSE_DISTANCE -
                                    distance
                                ) /
                                MOUSE_DISTANCE;


                            /*
                             * Las estrellas
                             * se separan
                             * ligeramente
                             */

                            star.x -=
                                dx *
                                force *
                                .0025;

                            star.y -=
                                dy *
                                force *
                                .0025;

                        }

                    }

                }
            );


            /*
             * Líneas entre estrellas
             */

            for (
                let i = 0;
                i < stars.length;
                i++
            ) {

                for (
                    let j = i + 1;
                    j < stars.length;
                    j++
                ) {

                    const a =
                        stars[i];

                    const b =
                        stars[j];


                    const dx =
                        a.x - b.x;

                    const dy =
                        a.y - b.y;


                    const distance =
                        Math.sqrt(
                            dx * dx +
                            dy * dy
                        );


                    if (
                        distance <
                        CONNECTION_DISTANCE
                    ) {

                        let opacity =
                            (
                                1 -
                                distance /
                                CONNECTION_DISTANCE
                            )
                            * .22;


                        /*
                         * Intensificar
                         * alrededor del mouse
                         */

                        if (
                            mouse.active
                        ) {

                            const da =
                                Math.hypot(
                                    mouse.x -
                                    a.x,
                                    mouse.y -
                                    a.y
                                );

                            const db =
                                Math.hypot(
                                    mouse.x -
                                    b.x,
                                    mouse.y -
                                    b.y
                                );


                            if (
                                da <
                                MOUSE_DISTANCE ||
                                db <
                                MOUSE_DISTANCE
                            ) {

                                opacity *= 3;

                            }

                        }


                        ctx.beginPath();

                        ctx.moveTo(
                            a.x,
                            a.y
                        );

                        ctx.lineTo(
                            b.x,
                            b.y
                        );


                        ctx.strokeStyle =
                            `rgba(
                                180,
                                190,
                                255,
                                ${opacity}
                            )`;


                        ctx.lineWidth =
                            .6;


                        ctx.stroke();

                    }

                }

            }


            /*
             * Líneas hacia el mouse
             */

            if (
                mouse.active
            ) {

                stars.forEach(
                    star => {

                        const dx =
                            mouse.x -
                            star.x;

                        const dy =
                            mouse.y -
                            star.y;


                        const distance =
                            Math.sqrt(
                                dx * dx +
                                dy * dy
                            );


                        if (
                            distance <
                            MOUSE_DISTANCE
                        ) {

                            const opacity =
                                (
                                    1 -
                                    distance /
                                    MOUSE_DISTANCE
                                )
                                * .65;


                            ctx.beginPath();


                            ctx.moveTo(
                                star.x,
                                star.y
                            );


                            ctx.lineTo(
                                mouse.x,
                                mouse.y
                            );


                            ctx.strokeStyle =
                                `rgba(
                                    190,
                                    200,
                                    255,
                                    ${opacity}
                                )`;


                            ctx.lineWidth =
                                .8;


                            ctx.stroke();

                        }

                    }
                );

            }


            /*
             * Dibujar estrellas
             */

            stars.forEach(
                star => {

                    let opacity =
                        star.opacity +
                        Math.sin(
                            star.pulse
                        ) * .18;


                    let radius =
                        star.radius;


                    /*
                     * Brillo adicional
                     * cerca del mouse
                     */

                    if (
                        mouse.active
                    ) {

                        const distance =
                            Math.hypot(
                                mouse.x -
                                star.x,

                                mouse.y -
                                star.y
                            );


                        if (
                            distance <
                            MOUSE_DISTANCE
                        ) {

                            const intensity =
                                1 -
                                distance /
                                MOUSE_DISTANCE;


                            radius +=
                                intensity *
                                1.8;


                            opacity +=
                                intensity *
                                .45;

                        }

                    }


                    ctx.beginPath();


                    ctx.arc(
                        star.x,
                        star.y,
                        radius,
                        0,
                        Math.PI * 2
                    );


                    ctx.fillStyle =
                        `rgba(
                            235,
                            240,
                            255,
                            ${Math.min(
                                1,
                                opacity
                            )}
                        )`;


                    ctx.fill();

                }
            );


            requestAnimationFrame(
                drawStars
            );

        }


        /*
         * Cuando el mouse entra
         * en una tarjeta:
         *
         * aumentamos la actividad
         * visual del fondo.
         */

        const services =
            document.querySelectorAll(
                ".service"
            );


        services.forEach(
            service => {

                service.addEventListener(
                    "mouseenter",
                    function() {

                        document.body
                            .classList
                            .add(
                                "card-active"
                            );

                        intensifyConstellation();

                    }
                );


                service.addEventListener(
                    "mouseleave",
                    function() {

                        document.body
                            .classList
                            .remove(
                                "card-active"
                            );

                    }
                );

            }
        );


        /*
         * Efecto de intensidad
         */

        function intensifyConstellation() {

            stars.forEach(
                star => {

                    star.vx *=
                        1.8;

                    star.vy *=
                        1.8;

                    setTimeout(
                        () => {

                            star.vx /= 1.8;

                            star.vy /= 1.8;

                        },
                        500
                    );

                }
            );

        }


        /*
         * Inicialización
         */

        window.addEventListener(
            "resize",
            resize
        );


        resize();

        drawStars();

    </script>


</body>

</html>
